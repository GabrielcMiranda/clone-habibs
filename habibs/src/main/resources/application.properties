spring.application.name=habibs

server.port=${SERVER_PORT:8080}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/habibs}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

spring.security.oauth2.resourceserver.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:classpath:public.pem}

security.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:classpath:private.pem}
security.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:classpath:public.pem}
security.jwt.issuer=${JWT_ISSUER:habibs-api}
security.jwt.access-token-ttl-hours=${JWT_ACCESS_TOKEN_TTL_HOURS:6}
